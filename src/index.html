<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <!-- Chicago-style font for Mac aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400&display=swap" rel="stylesheet">
    <!-- Montserrat font for Orpheus -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <!-- Press Start 2P font for Codagotchi -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Chicago';
        src: local('Chicago'), local('ChicagoFLF');
        font-weight: normal;
        font-style: normal;
      }
       @font-face {
             font-family: 'SysFont';
             src: url('../ChicagoFLF.ttf') format('truetype'),
                  url('./ChicagoFLF.ttf') format('truetype');
             font-weight: normal;
             font-style: normal;
             font-display: swap;
         }
         
         @font-face {
             font-family: 'InheritFont';
             src: local('Inherit'), 
                  local('Inherit-Regular'),
                  local('InheritFont');
             font-weight: normal;
             font-style: normal;
             font-display: swap;
         }
    </style>
    <title>Forrest Hartley Resume Website</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      .tooltip {
        position: absolute;
        z-index: 100;
        border: 1.5px solid white;
        background: #1b1d23;
        font-family: Arial;
        font-weight: bold;
        font-size: 1.8rem;
        display: none; /* Start hidden */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        padding-top: 5px;
        padding-bottom: 5px;
        margin: 10px;
        cursor: pointer;
        color: white;
        border-radius: 0 25px 25px 25px; /* Top-left, Top-right, Bottom-right, Bottom-left */
        /* font-family: "Comfortaa", sans-serif; */
        font-family: "Source Code Pro", monospace;
        font-optical-sizing: auto;
        font-weight: 600;
        font-style: normal;
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none;    /* Firefox */
        user-select: none;         /* Standard syntax */
      }

      /* Project category tooltips */
       .tooltip.orpheus-website {
         background: #780D24 !important;
         border: 1px solid #780D24 !important;
         color: white !important;
         font-family: "Montserrat", "Helvetica Neue", "Arial", sans-serif !important;
         font-weight: 300 !important;
       }

       .tooltip.orpheus-website:hover {
         background: white !important;
         border: 1px solid #780D24 !important;
         color: #780D24 !important;
         font-family: "Montserrat", "Helvetica Neue", "Arial", sans-serif !important;
         font-weight: 300 !important;
       }

      .tooltip.lyrictype-webapp {
        background: white !important;
        color: transparent !important;
        border: 2px solid black !important;
        border-radius: 0px !important;
        font-family: 'SysFont', 'Chicago', 'Geneva', 'Charcoal', 'Monaco', monospace !important;
        font-size: 1.6rem !important;
        font-weight: normal !important;
        position: absolute !important;
        padding: 8px 16px !important;
        overflow: visible !important;
        width: 300px !important;
        min-height: 40px !important;
        white-space: nowrap !important;
        text-align: center !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        box-sizing: border-box !important;
        border-radius: 0 8px 8px 8px !important; /* Top-left, Top-right, Bottom-right, Bottom-left */
      }

      .tooltip.lyrictype-webapp::before {
        content: '' !important;
        position: absolute !important;
        top: 8px !important;
        left: 6px !important;
        right: 6px !important;
        bottom: 8px !important;
        background-image: 
          repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            black 2px,
            black 4px,
            transparent 4px,
            transparent 6px
          ) !important;
        pointer-events: none !important;
        z-index: 1 !important;
      }

      .tooltip.lyrictype-webapp::after {
        content: 'lyrictype.com' !important;
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        background: white !important;
        padding: 4px 8px !important;
        z-index: 3 !important;
        color: black !important;
        font-family: 'SysFont', 'Chicago', 'Geneva', 'Charcoal', 'Monaco', monospace !important;
        font-size: 1.6rem !important;
        font-weight: normal !important;
      }








      .tooltip.codagotchi-extension {
        background: #0b60c2 !important;
        color: rgb(228, 222, 35) !important;
        border: 2px solid rgb(228, 222, 35) !important;
        font-family: "Press Start 2P", "Courier New", "Monaco", monospace !important;
        font-size: 1.2rem !important;
        font-weight: normal !important;
        text-transform: uppercase !important;
        letter-spacing: 1px !important;
        line-height: 1.4 !important;
      }

      .back-btn {
        display: none;
        z-index: 10;
        position: absolute;
        color: white;
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none;    /* Firefox */
        user-select: none;         /* Standard syntax */
      }

      .gesture-indicator {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: white;
        font-family: "Source Code Pro", monospace;
        font-weight: 400;
        font-size: 1.2rem;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
        pointer-events: none;
      }

      .gesture-indicator.show {
        opacity: 0.8;
        visibility: visible;
      }

      .gesture-hand {
        font-size: 2.5rem;
        margin-bottom: 10px;
        animation: dragGesture 2.5s infinite ease-in-out;
      }

      .gesture-text {
        text-align: center;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }

      @keyframes dragGesture {
        0% {
          transform: translateX(-20px) scale(0.95);
        }
        50% {
          transform: translateX(20px) scale(0.95);
        }
        100% {
          transform: translateX(-20px) scale(0.95);
        }
      }
      
    </style>
    <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
			}
		</script>
  </head>
  <body>
    <!-- <div id="back-btn"><i class="fa-solid fa-arrow-down"></i></div> -->
    <div class="gesture-indicator" id="gestureIndicator">
      <div class="gesture-hand"><i class="fa-solid fa-computer-mouse"></i></div>
      <div class="gesture-text">Click and drag to explore</div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
